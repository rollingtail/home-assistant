name: Release Home Assistant add-on

on:
  push:
    branches:
      - main
    paths:
      - tailscale/config.yaml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read add-on version
        id: version
        run: |
          version="$(sed -n 's/^version: *\"\([^\"]*\)\"$/\1/p' tailscale/config.yaml)"
          if [ -z "$version" ]; then
            echo "Could not read version from tailscale/config.yaml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=tailscale-$version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi

          gh release create "$TAG" \
            --title "Tailscale $VERSION" \
            --generate-notes
